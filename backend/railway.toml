[build]
builder = "DOCKERFILE"

[deploy]
# Both alembic and the seeder are off the startup chain on purpose.
# - Alembic: a previous deploy was SIGKILL'd mid-migration, left a zombie
#   txn holding locks on alembic_version, and every subsequent boot hung on
#   the first query for ~minutes until Railway killed it. Migrations must
#   not be able to block uvicorn from binding the port.
# - Seeder: downloads ~800 images sequentially, same problem.
#
# Run both manually after pushing migration / seed changes:
#   railway run --service Cultify alembic upgrade head
#   railway run --service Cultify python scripts/seed_exercises.py
# Both are idempotent so re-running is fine.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
